# Builds the Windows installer the way README.md documents it — stamp the
# retail edition, electron-builder --win dir, then compile
# scripts/jarvis-installer.nsi with makensis — and publishes the GitHub
# release with the exe attached, named to match previous releases.
name: Build and release installer

on:
  push:
    branches: [claude/jarvis-update-j75k8g]
  workflow_dispatch:

concurrency:
  group: release-installer
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: v0.20.0
  RELEASE_TITLE: "JARVIS 0.20.0 — LIVE CAMERAS"
  # Tag main's tip, which this branch contains — the workflow and release
  # notes are the only commits on top of it, and they don't touch the app.
  RELEASE_TARGET: 6cbc3039422767b17ae56224e45e3fb74a62ab4e

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch pinned go2rtc
        run: pwsh scripts/get-go2rtc.ps1

      - name: Run tests
        run: npm test

      - name: Stamp retail edition
        run: node scripts/stamp-edition.mjs retail

      - name: Build unpacked app
        run: npx electron-builder --win dir

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" scripts\jarvis-installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\JARVIS-FREE-SETUP.exe "dist\JARVIS-Setup-0.20.0.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Setup-0.20.0
          path: dist/JARVIS-Setup-0.20.0.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG "dist\JARVIS-Setup-0.20.0.exe" --clobber
          } else {
            gh release create $env:RELEASE_TAG "dist\JARVIS-Setup-0.20.0.exe" `
              --target $env:RELEASE_TARGET `
              --title $env:RELEASE_TITLE `
              --notes-file docs/releases/v0.20.0.md
          }
