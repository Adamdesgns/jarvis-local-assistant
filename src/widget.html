<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';">
    <title>JARVIS Orb</title>
    <link rel="stylesheet" href="widget.css">
  </head>
  <body>
    <div class="drag-zone">
      <button id="orb" class="orb" title="Click to open JARVIS · Drag anywhere to move · Scroll to resize">
        <canvas id="orb-canvas" class="orb-canvas"></canvas>
        <span class="ring ring-a"></span><span class="ring ring-b"></span><span class="ring ring-c"></span>
        <span class="orb-core"></span>
        <i id="orb-label">READY</i>
      </button>
    </div>
    <div class="fx" aria-hidden="true">
      <span class="whiteout"></span>
      <span class="shockwave"></span>
      <span class="debris" id="debris"></span>
    </div>
    <script src="orbs/orb-engine.js"></script>
    <script src="orbs/orb-utils.js"></script>
    <script src="orbs/orb-fx.js"></script>
    <script src="orbs/plasma.js"></script>
    <script src="orbs/neural.js"></script>
    <script src="orbs/classic.js"></script>
    <script src="orbs/zen.js"></script>
    <script src="orbs/halation.js"></script>
    <script src="orbs/aurora.js"></script>
    <script src="orbs/starfield.js"></script>
    <script src="orbs/ultron.js"></script>
    <script src="widget.js"></script>
  </body>
</html>
